services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: polla
      POSTGRES_PASSWORD: polla
      POSTGRES_DB: polla
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polla"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://polla:polla@db:5432/polla
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
